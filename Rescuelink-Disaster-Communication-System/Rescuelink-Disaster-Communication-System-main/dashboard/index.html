<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RescueLink — Rescuer Dashboard</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root {
      --bg:#0b0f19; --panel:#131a2b; --text:#e7ecf3; --muted:#8fa0b8;
      --critical:#ff1744; --high:#ffab00; --moderate:#00b0ff;
      --ackd:#7c4dff; --enroute:#00e5ff; --resolved:#00e676;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    #app { display:flex; height:100vh; }
    #sidebar { width:360px; background:var(--panel); display:flex; flex-direction:column; border-right:1px solid #222c42; }
    #map { flex:1; }
    header { padding:14px 16px; border-bottom:1px solid #222c42; }
    header h1 { margin:0; font-size:18px; }
    header .sub { color:var(--muted); font-size:12px; margin-top:2px; }
    #stats { display:flex; gap:8px; padding:10px 16px; border-bottom:1px solid #222c42; font-size:12px; }
    #stats .stat { flex:1; background:#0e1524; border-radius:8px; padding:8px; text-align:center; }
    #stats .stat b { display:block; font-size:18px; }
    #controls { padding:10px 16px; border-bottom:1px solid #222c42; display:flex; align-items:center; gap:10px; font-size:13px; }
    #list { flex:1; overflow:auto; }
    .card { padding:12px 16px; border-bottom:1px solid #1b2438; cursor:pointer; }
    .card:hover { background:#0e1524; }
    .card .row { display:flex; justify-content:space-between; align-items:center; }
    .card .name { font-weight:600; }
    .tier { font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; color:#0b0f19; }
    .tier.CRITICAL { background:var(--critical); color:#fff; }
    .tier.HIGH { background:var(--high); }
    .tier.MODERATE { background:var(--moderate); }
    .reason { color:var(--muted); font-size:12px; margin-top:4px; }
    .meta { color:var(--muted); font-size:11px; margin-top:4px; }
    .actions { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
    .actions button { flex:1; min-width:70px; border:0; border-radius:6px; padding:8px; font-size:11px; font-weight:600; cursor:pointer; color:#0b0f19; }
    .b-ack { background:var(--ackd); color:#fff; } .b-en { background:var(--enroute); } .b-res { background:var(--resolved); }
    .status-chip { font-size:10px; padding:1px 6px; border-radius:8px; background:#22304a; color:var(--muted); }
    #err { background:var(--critical); color:#fff; padding:6px 16px; font-size:12px; display:none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <header>
        <h1>🛟 RescueLink — Rescuer Dashboard</h1>
        <div class="sub">Live victim SOS bridged from the offline mesh</div>
      </header>
      <div id="err"></div>
      <div id="stats">
        <div class="stat"><b id="s-active">0</b>Active</div>
        <div class="stat"><b id="s-ackd">0</b>Ack/En route</div>
        <div class="stat"><b id="s-resolved">0</b>Resolved</div>
      </div>
      <div id="controls">
        <label><input type="checkbox" id="heatToggle" /> Heatmap (need density)</label>
      </div>
      <div id="list"></div>
    </div>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="app.js"></script>
</body>
</html>
